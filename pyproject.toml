[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "credit_system.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/**/migrations/*.py" = ["E501", "I"]
